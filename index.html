<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title></title>
<link rel="icon" href="assets/logo/adla-food.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#product-grid">انتقل إلى المنتجات</a>

<div id="catalog-app">
  <section class="app-shell" aria-label="كتالوغ ADLA FOOD">
    <header class="top">
      <div class="brand-row">
        <div class="logo">
          <div class="logo-mark"><img  alt="شعار ADLA FOOD"></div>
          <div><strong></strong><small></small></div>
        </div>
        <button class="header-cart" type="button" aria-label="فتح سلة الطلب" aria-controls="basket" aria-haspopup="dialog">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 10 4-7m10 7-4-7M3 10h18l-2 10H5L3 10Z"/><path d="M9 14v3m6-3v3"/></svg><b id="cart-count">0</b>
        </button>
      </div>
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="product-search" class="search" type="search" placeholder="" aria-label="البحث في المنتجات">
      </div>
    </header>

    <div class="service-strip" aria-label="مزايا الطلب">
      <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 5v10l9 4V13m9-5v5M7 6l9 5m0 7 2 2 4-5"/></svg><span class="service-label"></span></span>
      <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h11v12H3V5Zm11 5h4l3 4v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="service-label"></span></span>
      <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a9 9 0 0 1-13 8L3 21l1.5-5A9 9 0 1 1 21 11.5Z"/><path d="M8 9h8m-8 4h5"/></svg><span class="service-label"></span></span>
    </div>

    <main class="main">
      <h1 class="section-title" data-label="chooseCategory"></h1>
      <div class="category-nav">
        <button class="category-arrow category-arrow-right" type="button" aria-label="عرض الفئات السابقة" aria-controls="category-list" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      <div class="categories" id="category-list" role="group" aria-label="فئات المنتجات">
      </div>
        <button class="category-arrow category-arrow-left" type="button" aria-label="عرض الفئات التالية" aria-controls="category-list" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      </div>

      <div class="results-head"><h2 data-label="featuredTitle"></h2><span id="result-count" role="status"></span></div>
      <div class="products" id="product-grid" tabindex="-1">
      </div>
      <div class="empty" id="empty-state" hidden data-label="emptyResults"></div>

      <div class="cart-bar" id="cart-bar" hidden aria-label="ملخص الطلب">
        <button class="cart-info basket-trigger" type="button" aria-label="مراجعة سلة الطلب" aria-controls="basket" aria-haspopup="dialog"><strong><span id="cart-items">0</span> <span data-label="cartonsInOrder"></span></strong><small><span data-label="total"></span>: <span id="cart-total"></span></small></button>
        <button class="order-btn" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 11.5a9 9 0 0 1-13 8L3 21l1.5-5A9 9 0 1 1 21 11.5Z"/><path d="M8 9h8m-8 4h5"/></svg><span data-label="sendWhatsAppShort"></span></button>
      </div>
    <p class="order-note" id="order-note" role="status" hidden></p>
      <p class="sr-only" id="cart-status" role="status" aria-atomic="true"></p>
    </main>
  </section>
</div>

<dialog class="basket" id="basket" role="dialog" aria-modal="true" aria-labelledby="basket-title">
  <header class="basket-header">
    <div><h2 id="basket-title" data-label="basketTitle"></h2><p id="basket-count"></p></div>
    <button class="basket-close" type="button" aria-label="إغلاق سلة الطلب" autofocus>×</button>
  </header>
  <div class="basket-body">
    <div class="basket-empty" id="basket-empty">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m24 6 16 9-16 9-16-9 16-9Zm-16 9v18l16 9 16-9V15M24 24v18M16 10l16 9"/></svg>
      <h3 data-label="emptyBasket"></h3><p data-label="emptyBasketHint"></p>
    </div>
    <div id="basket-items" role="list" aria-label="منتجات الطلب"></div>
  </div>
  <footer class="basket-footer">
    <div class="basket-summary"><span id="basket-summary-count"></span><strong><span data-label="total"></span>: <bdi id="basket-total"></bdi></strong></div>
    <button class="order-btn basket-order" type="button" hidden data-label="sendWhatsApp"></button>
    <p class="order-note" id="basket-order-note" role="status" hidden></p>
  </footer>
  <p class="sr-only" id="basket-status" role="status" aria-atomic="true"></p>
</dialog>
<dialog class="basket order-dialog" id="order-dialog" aria-labelledby="order-title">
  <header class="basket-header">
    <h2 id="order-title" data-label="orderDetailsTitle"></h2>
    <button class="basket-close order-close" type="button">×</button>
  </header>
  <div class="basket-body">
    <form id="order-form" novalidate>
      <label for="market-name"><span data-label="marketNameLabel"></span> *</label>
      <input id="market-name" name="marketName" required autocomplete="organization" aria-describedby="market-error">
      <p id="market-error" class="order-note" role="alert" hidden></p>
      <label for="customer-note" data-label="orderNoteLabel"></label>
      <textarea id="customer-note" name="note" rows="3"></textarea>
      <button class="order-btn" type="submit" data-label="continueOrder"></button>
    </form>
    <div id="order-review" hidden>
      <dl>
        <dt data-label="orderIdLabel"></dt><dd><bdi id="review-id"></bdi></dd>
        <dt data-label="orderDateLabel"></dt><dd><bdi id="review-date"></bdi></dd>
        <dt data-label="marketLabel"></dt><dd id="review-market"></dd>
        <dt data-label="totalCartonsLabel"></dt><dd id="review-count"></dd>
        <dt data-label="orderTotalLabel"></dt><dd><bdi id="review-total"></bdi></dd>
      </dl>
      <p id="review-note" hidden></p>
      <button class="order-btn" id="open-whatsapp" type="button" data-label="openWhatsApp"></button>
      <button class="basket-remove" id="back-to-order" type="button" data-label="backToOrder"></button>
    </div>
    <p id="order-error" class="order-note" role="alert" hidden></p>
  </div>
</dialog>
<script src="data/catalog-data.js" defer></script>
<script src="js/order.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
